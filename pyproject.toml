[tool.poetry]
name = "citybike-dbt"
version = "0.1.0"
description = "NYC Citi Bike 2023 – dbt + DuckDB analysis"
authors = ["Kunal Arora"]          
readme = "README.md"
packages = [{ include = "citybike_dbt" }]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
urllib3 = ">=1.26.17"
duckdb = "^0.10.2"
dbt-duckdb = "^1.7"
pandas = "^2.2"
tqdm = "^4.66"
requests = "^2.28.0"
pyarrow = "^15.0"
pyspark = "^3.5"
dbt-core = "^1.7"

[tool.poetry.group.dev.dependencies]             
black = "^24.3"
ruff = "^0.3"
pytest = "^8.1"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"